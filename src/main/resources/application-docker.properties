spring.application.name=auth-server
server.port=8080

spring.config.import=optional:file:.env[.properties]

# Banco de Dados Local (Padrão)
# Se as variáveis de ambiente não estiverem definidas, usa os valores padrão do localhost
spring.datasource.url=${DOCKER_DB_URL}
spring.datasource.username=${DOCKER_DB_USERNAME}
spring.datasource.password=${DOCKER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Segurança
api.security.token.secret=${JWT_SECRET}
api.security.token.issuer=${API_SECURITY_TOKEN_ISSUER}

spring.flyway.repair-on-migrate=true

