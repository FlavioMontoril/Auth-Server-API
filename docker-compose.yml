services:
  db:
    image: postgres:16-alpine
    container_name: auth-server-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME}
      POSTGRES_USER: ${DOCKER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USERNAME} -d ${DOCKER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_server_db_data:/var/lib/postgresql/data
    networks:
      - auth-server-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: auth-server-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - auth-server-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: auth-server-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Permite acesso tanto via localhost (sua IDE) quanto pelo nome do container 'kafka'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - auth-server-network

  api:
    build: .
    container_name: auth-server-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Spring lê estas variáveis que vêm do .env via Docker Compose
      DOCKER_DB_URL: ${DOCKER_DB_URL}
      DOCKER_DB_USERNAME: ${DOCKER_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_SECURITY_TOKEN_ISSUER: ${API_SECURITY_TOKEN_ISSUER}
      UPLOAD_DIR: ${UPLOAD_DIR}
      VITE_URL: ${VITE_URL}
    volumes:
      # 1. Volume nomeado para persistir o diretório de uploads no container
      - auth_server_uploads:/var/lib/auth-server/uploads
    networks:
      - auth-server-network

# volumes:
#   postgres_data:
volumes:
  auth_server_db_data:
  auth_server_uploads:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  auth-server-network:
    name: auth-server-network
    driver: bridge