services:
  db:
    image: postgres:16-alpine
    container_name: auth-server-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOCKER_DB_NAME}
      POSTGRES_USER: ${DOCKER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DB_USERNAME} -d ${DOCKER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_server_db_data:/var/lib/postgresql/data
    networks:
      - auth-server-network

  api:
    build: .
    container_name: auth-server-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Spring lê estas variáveis que vêm do .env via Docker Compose
      DOCKER_DB_URL: ${DOCKER_DB_URL}
      DOCKER_DB_USERNAME: ${DOCKER_DB_USERNAME}
      DOCKER_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_SECURITY_TOKEN_ISSUER: ${API_SECURITY_TOKEN_ISSUER}
      UPLOAD_DIR: ${UPLOAD_DIR}
      VITE_URL: ${VITE_URL}
    volumes:
      # 1. Volume nomeado para persistir o diretório de uploads no container
      - auth_server_uploads:/var/lib/auth-server/uploads
    networks:
      - auth-server-network

# volumes:
#   postgres_data:
volumes:
  auth_server_db_data:
  # 2. Declaração do volume gerenciado pelo Docker
  auth_server_uploads:

networks:
  auth-server-network:
    name: auth-server-network
    driver: bridge